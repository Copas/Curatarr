overview: "Leaving Soon instead of Delete, playable audio for each device, and posters per account, with Curatarr"
description: >
  Makes Jellyfin and Curatarr work together. Delete in any Jellyfin app marks
  a film or show Leaving Soon instead of deleting its files, so it leaves
  through Radarr or Sonarr and can still be saved; each device plays the copy
  and audio track it can play without converting; and each account can have
  posters of its own.
category: "General"
