<div id="artwork-live" data-status-url="{{ url_for('main.artwork_live') }}"{% if live %} data-active="1"{% endif %}>
{% if jobs %}<div class="table-responsive"><table class="table align-middle artwork-jobs">
<thead><tr><th>Title</th><th>Pictures</th><th>Engine</th><th>State</th><th class="text-end">Asked for</th></tr></thead>
<tbody>{% for job in jobs %}{% include '_artwork_job_row.html' %}{% endfor %}</tbody></table></div>
{% else %}<div class="empty-state"><h2 class="h6">No jobs{{ ' like that' if state }}</h2><p class="mb-0"><a href="{{ url_for('main.artwork_generate') }}">Generate</a> some artwork to start.</p></div>{% endif %}
</div>
