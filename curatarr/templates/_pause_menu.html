{# Pause all work: frees the graphics card and processor for something else. #}
{% if not work_paused %}<details class="action-menu pause-menu"><summary class="btn btn-sm btn-outline-secondary" data-tip="Stops all of Curatarr's processing and unloads the language model, to free the graphics card and processor for something else.">Pause all work</summary><div class="action-menu-items">{% for hours, label in [('1', 'For 1 hour'), ('4', 'For 4 hours'), ('0', 'Until I resume')] %}<form method="post" action="{{ url_for('main.pause_work') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="hours" value="{{ hours }}"><input type="hidden" name="next" value="{{ request.full_path }}"><button>{{ label }}</button></form>{% endfor %}</div></details>{% endif %}
