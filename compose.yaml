services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: curatarr
      POSTGRES_USER: curatarr
      POSTGRES_PASSWORD: ${CURATARR_DB_PASSWORD:?Set CURATARR_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curatarr -d curatarr"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://curatarr:${CURATARR_DB_PASSWORD}@db:5432/curatarr
      CURATARR_SECRET_KEY: ${CURATARR_SECRET_KEY:?Set CURATARR_SECRET_KEY}
      CURATARR_AUTO_MIGRATE: "true"
    ports:
      - "8787:8787"
    volumes:
      - config:/config
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    command: ["flask", "--app", "curatarr", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://curatarr:${CURATARR_DB_PASSWORD}@db:5432/curatarr
      CURATARR_SECRET_KEY: ${CURATARR_SECRET_KEY:?Set CURATARR_SECRET_KEY}
    volumes:
      - config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  database:
  config:

