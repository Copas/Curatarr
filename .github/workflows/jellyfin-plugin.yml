name: Jellyfin plugin

on:
  push:
    branches: [main]
    paths: ["jellyfin-plugin/**", "CHANGELOG.md", ".github/workflows/jellyfin-plugin.yml"]
  pull_request:
    paths: ["jellyfin-plugin/**", "CHANGELOG.md", ".github/workflows/jellyfin-plugin.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jellyfin-plugin
    steps:
      - uses: actions/checkout@v5
      - name: .NET 10
        # From Microsoft's CDN: setup-dotnet's default download server answered
        # 409 for every version for hours on 2026-10-25, failing every build.
        working-directory: .
        run: |
          curl -sSL --retry 3 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 \
            --azure-feed https://builds.dotnet.microsoft.com/dotnet --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Notes for this version
        # The version in Directory.Build.props needs notes in CHANGELOG.md
        # before it can be released (scripts/notes.py); say so on the push.
        run: python3 scripts/notes.py "$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" > /dev/null
      - run: dotnet test Jellyfin.Plugin.Curatarr.Tests -c Release
