name: Jellyfin plugin release

# Push a tag like plugin-v0.1.0.0 (matching <Version> in
# jellyfin-plugin/Directory.Build.props): the plugin is built, attached to a
# GitHub release, and added to jellyfin-plugin/manifest.json, which Jellyfin
# reads as a plugin repository. Curatarr's own releases use v* tags.
#
# A tag whose build failed (a download outage, say) can be built again by
# hand: Actions → Jellyfin plugin release → Run workflow, with the tag.
on:
  push:
    tags: ["plugin-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The plugin tag to release, e.g. plugin-v0.8.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: jellyfin-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: .NET 10
        # From Microsoft's CDN: setup-dotnet's default download server answered
        # 409 for every version for hours on 2026-10-25, failing every build.
        working-directory: .
        run: |
          curl -sSL --retry 3 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 \
            --azure-feed https://builds.dotnet.microsoft.com/dotnet --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Release notes
        # From CHANGELOG.md's "## Jellyfin plugin" section; no notes, no release.
        run: python3 scripts/notes.py "${TAG#plugin-v}" > "$RUNNER_TEMP/notes.md"
      - run: dotnet test Jellyfin.Plugin.Curatarr.Tests -c Release
      - name: Package
        id: package
        run: |
          version="${TAG#plugin-v}"
          dotnet publish Jellyfin.Plugin.Curatarr -c Release -o out -p:Version="$version"
          zip="curatarr-jellyfin-plugin_${version}.zip"
          (cd out && zip "../$zip" Jellyfin.Plugin.Curatarr.dll)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "${{ steps.package.outputs.zip }}" \
            --title "Jellyfin plugin ${{ steps.package.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Add to manifest.json
        run: |
          python3 scripts/manifest.py \
            --version "${{ steps.package.outputs.version }}" \
            --checksum "${{ steps.package.outputs.md5 }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.package.outputs.zip }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add Jellyfin plugin ${{ steps.package.outputs.version }} to manifest.json"
          git push origin main
